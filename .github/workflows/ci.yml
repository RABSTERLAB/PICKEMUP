name: CI
on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  backend:
    # pinned: ubuntu-latest migrates to Ubuntu 26 (Oct 2026) and silently
    # changes the toolchain under CI; reproducible beats bleeding-edge here
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>&1 | tee install.log || {
            # step summaries are public even when raw logs need login
            echo "### Install failed — last pip output:" >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 install.log | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      - name: Tests
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
