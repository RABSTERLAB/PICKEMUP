[project]
name = "pickemup"
version = "0.1.0"
description = "PICKEMUP — OSINT & coordinated-network intelligence platform (local)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13",
  "networkx>=3.3",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.package-dir]
pickemup_api = "services/api/pickemup_api"
pickemup_connectors = "packages/connectors/pickemup_connectors"
pickemup_analysis = "packages/analysis-core/pickemup_analysis"

[tool.setuptools.packages.find]
where = ["services/api", "packages/connectors", "packages/analysis-core"]
include = ["pickemup_api*", "pickemup_connectors*", "pickemup_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
